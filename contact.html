<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Liên hệ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>
  <div class="total-container">
  <div class="contact-container">
    <!-- Form liên hệ -->
    <div id="contactForm" class="contact-form">
      <h2>Liên hệ với tôi</h2>
      <form id="contactFormInputs">
        <label for="name">Tên:</label><br>
        <input type="text" id="name" name="name"><br>
        <div id="nameError" class="error-message"></div><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        <div id="emailError" class="error-message"></div><br>

        <label for="message">Tin nhắn:</label><br>
        <textarea id="message" name="message"></textarea><br>
        <div id="messageError" class="error-message"></div><br>

        <button type="button" id="sendBtn">Gửi</button>
      </form>
    </div>
  </div>

    <!-- Mạng xã hội -->
    <div class="social-links">
      <h2>Theo dõi tôi</h2>
      <a href="https://www.facebook.com" class="social-btn facebook" target="_blank">
        <i class="bi bi-facebook"></i> Facebook
      </a>
      <a href="https://www.tiktok.com" class="social-btn tiktok" target="_blank">
        <i class="bi bi-tiktok"></i> TikTok
      </a>
      <a href="https://www.instagram.com" class="social-btn instagram" target="_blank">
        <i class="bi bi-instagram"></i> Instagram
      </a>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
